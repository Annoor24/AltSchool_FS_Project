<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <div class="calculator">
        <div class="display">
          <div class="expression" id="expression"></div>
          <div class="current-value" id="display">0</div>
        </div>
        <div class="buttons">
          <!-- First row of buttons -->
          <button class="btn btn-num" data-val="1">1</button>
          <button class="btn btn-num" data-val="2">2</button>
          <button class="btn btn-num" data-val="3">3</button>
          <button class="btn btn-op" data-val="*">×</button>
          <button class="btn btn-op" data-val="/">÷</button>

          <!-- Second row -->
          <button class="btn btn-num" data-val="4">4</button>
          <button class="btn btn-num" data-val="5">5</button>
          <button class="btn btn-num" data-val="6">6</button>
          <button class="btn btn-op" data-val="+">+</button>
          <button class="btn btn-op" data-val="-">-</button>

          <!-- Third row -->
          <button class="btn btn-num" data-val="7">7</button>
          <button class="btn btn-num" data-val="8">8</button>
          <button class="btn btn-num" data-val="9">9</button>
          <button class="btn btn-op" data-val="%">%</button>
          <button class="btn btn-op" data-val="^">^</button>

          <!-- Fourth row -->
          <button class="btn btn-num" data-val=".">.</button>
          <button class="btn btn-num" data-val="0">0</button>
          <button class="btn btn-num btn-back" id="backspace" title="Backspace">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
          </button>
          <button class="btn btn-op btn-clear" id="clear">C</button>
          <button class="btn btn-equal" id="equals">=</button>
        </div>
        <button class="btn-history-toggle" id="open-history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          View History
        </button>
      </div>
    </main>

    <!-- This is the popup for the history -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2>Calculation History</h2>
          <button class="btn-close" id="close-history">&times;</button>
        </div>
        <div class="modal-body">
          <div class="history-list" id="history-list">
            <!-- JavaScript will put history items here -->
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-clear-history" id="clear-history">Clear All History</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
